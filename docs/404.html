<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="robots" content="noindex">
    <title>Conductor — Page not found</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0f0f23; color: #e8e8f0; text-align: center; padding: 24px; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { color: #a0a0b8; margin: 0 0 24px; line-height: 1.5; }
        a {
            display: inline-block; margin: 6px; padding: 12px 20px; border-radius: 10px;
            background: #4a9eff; color: #fff; text-decoration: none; font-weight: 600;
        }
        a.plain { background: none; border: 1px solid #4a9eff; color: #4a9eff; }
    </style>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p>This page isn’t here. It may have moved, or the link has a typo.</p>
        <a id="go-app" href="index.html">Open Conductor</a>
        <a id="go-start" class="plain" href="start.html">About Conductor</a>
    </main>
    <script>
        // Served for a missing page at any depth, so point the links at the site
        // root (the first path segment, e.g. /conductor/). A local file keeps the
        // plain relative links.
        if (location.protocol !== 'file:') {
            const root = location.pathname.split('/').slice(0, 2).join('/') + '/';
            document.getElementById('go-app').href = root + 'index.html';
            document.getElementById('go-start').href = root + 'start.html';
        }
    </script>
</body>
</html>
